name: Publish GitHub release

run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pages: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Publish Pages and GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseSha = process.env.RELEASE_SHA;
            const releaseTag = process.env.RELEASE_TAG;

            if (!releaseSha) {
              throw new Error("GitHub did not provide the tag commit SHA.");
            }
            if (!releaseTag || !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(releaseTag)) {
              throw new Error(`Tag must use stable vX.Y.Z form: ${releaseTag ?? "missing"}`);
            }

            const { owner, repo } = context.repo;
            const { data: master } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "master",
            });
            if (master.commit.sha !== releaseSha) {
              throw new Error(
                `Tag ${releaseTag} targets ${releaseSha}, but master targets ${master.commit.sha}.`,
              );
            }

            /**
             * Read a repository file as text at a ref.
             *
             * Returns undefined for a missing file when allowMissing is true.
             */
            const readFileAtRef = async (path, ref, allowMissing = false) => {
              let file;
              try {
                ({ data: file } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path,
                  ref,
                }));
              } catch (error) {
                if (allowMissing && error.status === 404) {
                  return undefined;
                }
                throw error;
              }

              if (Array.isArray(file) || file.type !== "file" || file.encoding !== "base64") {
                throw new Error(`Cannot read ${path} from ${ref}.`);
              }

              return Buffer.from(file.content, "base64").toString("utf8");
            };

            const source = await readFileAtRef("s-vhs.sh", releaseTag);
            const normalizedSource = source.replace(/\r\n/g, "\n");
            const versionMatch = /\nsvhs_version\(\) \{\n\s*printf '%s\\n' '([^']*)'\n\}/.exec(
              normalizedSource,
            );
            if (!versionMatch) {
              throw new Error(`Cannot read the svhs_version literal from s-vhs.sh at ${releaseTag}.`);
            }
            if (versionMatch[1] !== releaseTag.slice(1)) {
              throw new Error(
                `svhs_version reports ${versionMatch[1]}, but the tag is ${releaseTag}.`,
              );
            }

            const changelog = (await readFileAtRef("CHANGELOG.md", releaseTag)).replace(
              /\r\n/g,
              "\n",
            );
            const lines = changelog.split("\n");
            const headingPrefix = `## \`[${releaseTag}]\` - `;
            const matchingHeadingIndexes = [];

            for (let index = 0; index < lines.length; index += 1) {
              if (lines[index].startsWith(headingPrefix)) {
                matchingHeadingIndexes.push(index);
              }
            }
            if (matchingHeadingIndexes.length !== 1) {
              throw new Error(
                `Expected one changelog heading for ${releaseTag}, found ${matchingHeadingIndexes.length}.`,
              );
            }

            const headingIndex = matchingHeadingIndexes[0];
            const releaseDate = lines[headingIndex].slice(headingPrefix.length);
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(releaseDate)) {
              throw new Error(
                `Changelog heading for ${releaseTag} must contain a DD.MM.YYYY release date.`,
              );
            }

            let nextHeadingIndex = lines.length;
            for (let index = headingIndex + 1; index < lines.length; index += 1) {
              if (lines[index].startsWith("## ")) {
                nextHeadingIndex = index;
                break;
              }
            }

            const releaseNotes = lines
              .slice(headingIndex + 1, nextHeadingIndex)
              .join("\n")
              .trim();
            if (!releaseNotes) {
              throw new Error(`Changelog section for ${releaseTag} is empty.`);
            }

            let existingRelease;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: releaseTag,
              });
              existingRelease = response.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (existingRelease) {
              const matches = existingRelease.tag_name === releaseTag
                && existingRelease.name === releaseTag
                && existingRelease.body === releaseNotes
                && !existingRelease.draft
                && !existingRelease.prerelease;
              if (!matches) {
                throw new Error(`An inconsistent GitHub release already exists for ${releaseTag}.`);
              }
            }

            const { data: deployBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "deploy",
            });
            const deployHeadSha = deployBranch.commit.sha;
            const existingVersion = await readFileAtRef(releaseTag, "deploy", true);
            const existingLatest = await readFileAtRef("latest", "deploy", true);
            const { data: deployEntries } = await github.rest.repos.getContent({
              owner,
              repo,
              path: "",
              ref: "deploy",
            });
            if (!Array.isArray(deployEntries)) {
              throw new Error("Cannot list files on deploy.");
            }

            /** Compare two stable vX.Y.Z tags numerically. */
            const compareStableTags = (left, right) => {
              const leftParts = left.slice(1).split(".").map(Number);
              const rightParts = right.slice(1).split(".").map(Number);

              for (let index = 0; index < leftParts.length; index += 1) {
                if (leftParts[index] !== rightParts[index]) {
                  return leftParts[index] - rightParts[index];
                }
              }
              return 0;
            };

            const deployedTags = deployEntries
              .map((entry) => entry.name)
              .filter((name) => /^v[0-9]+\.[0-9]+\.[0-9]+$/.test(name));
            const newestDeployedTag = deployedTags.reduce((newest, tag) => {
              if (!newest || compareStableTags(tag, newest) > 0) {
                return tag;
              }
              return newest;
            }, undefined);
            const isNewestVersion = !newestDeployedTag
              || compareStableTags(releaseTag, newestDeployedTag) >= 0;

            if (!isNewestVersion && !existingRelease) {
              throw new Error(
                `Cannot publish ${releaseTag} after newer version ${newestDeployedTag}.`,
              );
            }
            if (existingVersion !== undefined && existingVersion !== source) {
              throw new Error(`${releaseTag} already exists on deploy with different content.`);
            }

            const versionNeedsUpdate = existingVersion !== source;
            const latestNeedsUpdate = isNewestVersion && existingLatest !== source;
            let pagesCommitSha = deployHeadSha;
            if (versionNeedsUpdate || latestNeedsUpdate) {
              const { data: deployCommit } = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: deployHeadSha,
              });
              const { data: sourceBlob } = await github.rest.git.createBlob({
                owner,
                repo,
                content: Buffer.from(source, "utf8").toString("base64"),
                encoding: "base64",
              });
              const treeEntries = [];
              if (versionNeedsUpdate) {
                treeEntries.push({
                  path: releaseTag,
                  mode: "100644",
                  type: "blob",
                  sha: sourceBlob.sha,
                });
              }
              if (latestNeedsUpdate) {
                treeEntries.push({
                  path: "latest",
                  mode: "100644",
                  type: "blob",
                  sha: sourceBlob.sha,
                });
              }
              const { data: pagesTree } = await github.rest.git.createTree({
                owner,
                repo,
                base_tree: deployCommit.tree.sha,
                tree: treeEntries,
              });
              const { data: pagesCommit } = await github.rest.git.createCommit({
                owner,
                repo,
                message: `Publish ${releaseTag}`,
                tree: pagesTree.sha,
                parents: [deployHeadSha],
              });

              await github.rest.git.updateRef({
                owner,
                repo,
                ref: "heads/deploy",
                sha: pagesCommit.sha,
                force: false,
              });
              pagesCommitSha = pagesCommit.sha;
              core.info(`Updated deploy to ${pagesCommitSha}.`);
            } else if (isNewestVersion) {
              core.info(`${releaseTag} and latest already match the released source.`);
            } else {
              core.info(`${releaseTag} already matches; latest remains ${newestDeployedTag}.`);
            }

            // GITHUB_TOKEN pushes do not trigger branch-based Pages builds
            await github.request("POST /repos/{owner}/{repo}/pages/builds", {
              owner,
              repo,
            });

            const wait = (milliseconds) => new Promise((resolve) => {
              setTimeout(resolve, milliseconds);
            });

            let completedBuild;
            for (let attempt = 0; attempt < 60; attempt += 1) {
              if (attempt > 0) {
                await wait(5000);
              }

              const { data: build } = await github.request(
                "GET /repos/{owner}/{repo}/pages/builds/latest",
                { owner, repo },
              );
              if (build.commit !== pagesCommitSha) {
                continue;
              }
              if (build.status === "errored") {
                throw new Error(
                  `Pages build failed: ${build.error?.message ?? "unknown error"}`,
                );
              }
              if (build.status === "built") {
                completedBuild = build;
                break;
              }
            }
            if (!completedBuild) {
              throw new Error(`Pages did not build deploy commit ${pagesCommitSha} in time.`);
            }

            const pagesUrl = `https://${owner}.github.io/${repo}/${releaseTag}`;
            const expectedSource = Buffer.from(source, "utf8");
            let pagesVerified = false;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const response = await fetch(`${pagesUrl}?commit=${pagesCommitSha}`, {
                headers: { "cache-control": "no-cache" },
              });
              if (response.ok) {
                const publishedSource = Buffer.from(await response.arrayBuffer());
                if (publishedSource.equals(expectedSource)) {
                  pagesVerified = true;
                  break;
                }
              }
              await wait(5000);
            }
            if (!pagesVerified) {
              throw new Error(`${pagesUrl} does not serve the released source.`);
            }
            core.notice(`Published ${pagesUrl}`);

            if (existingRelease) {
              core.notice(`Matching release already exists: ${existingRelease.html_url}`);
              return;
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: releaseTag,
              target_commitish: releaseSha,
              name: releaseTag,
              body: releaseNotes,
              draft: false,
              prerelease: false,
              make_latest: "true",
            });
            if (
              release.tag_name !== releaseTag
              || release.name !== releaseTag
              || release.body !== releaseNotes
              || release.draft
              || release.prerelease
            ) {
              throw new Error(`GitHub returned an inconsistent release for ${releaseTag}.`);
            }

            core.notice(`Published ${release.html_url}`);
